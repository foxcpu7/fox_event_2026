<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoX Klanový Turnaj 2026</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --match-bg: #0f172a;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #b45309;
            --success: #22c55e;
            --danger: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1350px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2, h3 { margin-top: 0; }

        /* --- ADMIN LIŠTA --- */
        .top-admin-bar {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #16a34a; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #dc2626; }

        .lock-status {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* --- NAVIGAČNÍ ZÁLOŽKY --- */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 12px;
        }

        .tab-btn {
            background-color: var(--match-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
            flex: 1;
            min-width: 125px;
            text-align: center;
        }

        .tab-btn:hover {
            color: #fff;
            border-color: var(--accent);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* --- KARTY HRÁČŮ --- */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px 8px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 2px solid transparent;
            position: relative;
        }

        .player-card.rank-1 { border-color: var(--gold); }
        .player-card.rank-2 { border-color: var(--silver); }
